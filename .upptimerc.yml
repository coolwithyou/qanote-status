owner: coolwithyou
repo: qanote-status

sites:
  - name: QA Note Web
    url: https://qanote.app
    expectedStatusCodes:
      - 200
  - name: QA Note API
    url: https://qanote.app/api/health
    expectedStatusCodes:
      - 200
  - name: QA Note Extension API
    url: https://qanote.app/api/extension/health
    expectedStatusCodes:
      - 200
  - name: QA Note MCP
    url: https://qanote.app/api/mcp/health
    expectedStatusCodes:
      - 200

status-website:
  cname: status.qanote.app
  name: QA Note Status
  theme: light
  introTitle: "**QA Note** 서비스 상태"
  introMessage: 현재 서비스 운영 상태를 실시간으로 확인할 수 있습니다.
  navbar:
    - title: QA Note
      href: https://qanote.app
    - title: 보안
      href: https://qanote.app/security

i18n:
  activeIncidents: 진행 중인 인시던트
  pastIncidents: 과거 인시던트
  pastIncidentsResolved: 해결됨
  liveStatus: 실시간 상태
  allSystemsOperational: 모든 시스템 정상 운영 중
  degradedPerformance: 성능 저하
  completedMaintenance: 유지보수 완료
  scheduledMaintenance: 예정된 유지보수

workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "*/5 * * * *"
  uptime: "*/5 * * * *"
